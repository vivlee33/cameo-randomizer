<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Randomizer</title>
  <style>
    body {
      font-family: Chalkboard SE, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #EFD4BB;
    }
    .container {
      background: #FFF;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      max-width: 420px;
      text-align: center;
      border: 1px solid #F89999;
      /* Grid background */
      background-image:
      repeating-linear-gradient(#E3EAD9 0 1px, transparent 1px 20px),
      repeating-linear-gradient(90deg, #E3EAD9 0 1px, transparent 1px 20px);
      background-size: 20px 20px;
    }
    #result {
      border: 1px solid #8BA861;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      min-height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      background: #BDD69A;
      color: #FFF5D4;
      /* Drop shadow: 2pt offset (~2px), 5pt blur (~5px), 75% opacity, 270° (down), hex color #FE6347 */
      text-shadow: 0px 1px 2px rgba(254, 99, 71, 0.75);
    }
    button {
      font-family: Chalkboard SE, sans-serif;
      padding: 12px 24px;
      border: 1px solid #FE6347;
      border-radius: 10px;
      background: #F89999;
      color: white;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    button:hover {
      background: #F86267;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="result">Click the button to randomize!</div>
    <button onclick="randomize()">Randomize</button>
  </div>

  <script>
    const items = [
      "Taylor Swift",
      "Ariana Grande",
      "Harry Styles",
      "Billie Eilish",
      "Beyoncé",
      "Elon Musk",
      "Ed Sheeran",
      "Megan Thee Stallion",
      "Lizzo",
      "Lady Gaga",
      "Doja Cat",
      "Jack Black",
      "Gordon Ramsay",
      "Barbie",
      "Shrek",
      "Iroh (Avatar: The Last Airbender)",
      "Wednesday Addams",
      "Elsa (Frozen)",
      "Spider-Man",
      "Iron Man",
      "Hermione Granger",
      "Rick Sanchez (Rick & Morty)",
      "Morty (Rick & Morty)",
      "Tony Stark",
      "Patrick Star",
      "Squidward (SpongeBob)",
      "Mufasa (The Lion King)",
      "Velma (Scooby-Doo)",
      "Scooby-Doo",
      "Bugs Bunny",
      "Daffy Duck",
      "Marilyn Monroe",
      "Albert Einstein",
      "Cleopatra",
      "Abraham Lincoln",
      "Shakespeare",
      "Leonardo da Vinci",
      "Winston Churchill",
      "Napoleon",
      "Queen Elizabeth II",
      "Gandhi"
    ];

    function randomize() {
      const randomPick = items[Math.floor(Math.random() * items.length)];
      document.getElementById("result").textContent = randomPick;
    }
  </script>
</body>
</html>
